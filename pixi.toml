[workspace]
name = "pixi_ros2_Template"
version = "0.1.0"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[activation]
scripts = ["bash_scripts/setup_env.sh"]

[activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
QT_QPA_PLATFORM = "xcb"
QT_SCREEN_SCALE_FACTORS = "1"
QT_ENABLE_HIGHDPI_SCALING = "0"
QT_SCALE_FACTOR = "1"
FONTCONFIG_PATH = "/etc/fonts"
FONTCONFIG_FILE = "/etc/fonts/fonts.conf"

[tasks]
build = "bash bash_scripts/build.sh"
clean = "bash bash_scripts/build.sh clean"
test = "colcon test"
kill-gz = "killall -9 gz-sim-main gz-sim-gui-client 2>/dev/null || true"

[dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-xacro = "*"
ros-jazzy-urdf = "*"
ros-jazzy-tf-transformations = "*"
ros-jazzy-slam-toolbox = "*"
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-robot-localization = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-nav2-lifecycle-manager = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
qt6-main = "*"
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
ninja = "*"

